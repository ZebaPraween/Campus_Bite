<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Campus Bite — Login/Register</title>
  <link rel="stylesheet" href="/Login_page/sign.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Toast container -->

  <div class="wrap">
    <div class="card" role="application" aria-label="Campus Bite authentication card">
      <!-- LEFT: forms -->
      <div class="left" aria-hidden="false">
        <div>
          <div class="brand">
            <div class="logo" aria-hidden="true">🍽️</div>
            <div>
              <div style="font-weight:700;font-size:20px">Campus Bite</div>
              <div class="muted small">Order ahead — skip the line</div>
            </div>
          </div>

          <div class="tabs" role="tablist" aria-label="Auth tabs">
            <div id="tabSign" class="tab active" role="tab" aria-selected="true" tabindex="0">Sign In</div>
            <div id="tabReg" class="tab" role="tab" aria-selected="false" tabindex="0">Register</div>
          </div>
        </div>

        <div class="slider-wrap" id="sliderWrap">
          <div class="forms" id="forms" aria-live="polite">
            <!-- SIGN IN PANEL -->
            <div class="panel" aria-labelledby="tabSign" role="region">
              <div class="field">
                <select id="role" class="input" aria-label="Role">
                  <option value="student">Student</option>
                  <option value="vendor">Vendor</option>
                  <option value="admin">Admin</option>
                </select>
                <label class="flabel">Login as</label>
              </div>

              <div class="field">
                <input id="signinEmail" class="input" type="email" placeholder=" " autocomplete="email" required>
                <label class="flabel">Email / ID</label>
              </div>

              <div class="field" style="margin-bottom:4px">
                <input id="signinPass" class="input" type="password" placeholder=" " autocomplete="current-password" required>
                <label class="flabel">Password</label>
                <span id="toggleSignEye" class="eye" role="button" aria-label="Toggle password">👁</span>
              </div>

              <div style="display:flex;justify-content:space-between;align-items:center;">
                <label class="small"><input id="remember" type="checkbox"> Remember me</label>
                <a href="#" class="small muted">Forgot password?</a>
              </div>

              <div>
                <button id="registerBtn" class="btn ripple ghost" type="button">Sign in</button>
              </div>

              

</div>

            <!-- REGISTER PANEL -->
            <div class="panel" aria-labelledby="tabReg" role="region">
              <div class="field">
                <input id="regName" class="input" type="text" placeholder=" " autocomplete="name" required>
                <label class="flabel">Full Name</label>
              </div>

              <div class="field">
                <input id="regid" class="input" type="text" placeholder=" " autocomplete="off" required>
<label class="flabel" >SBU ID</label>

              </div>

              <div class="field">
                <input id="regPass" class="input" type="password" placeholder=" " autocomplete="new-password" required>
                <label class="flabel">Create Password</label>
                <span id="toggleRegEye" class="eye" role="button" aria-label="Toggle password">👁</span>
              </div>

              <div>
                <button id="registerBtn" class="btn ripple ghost" type="button">Create Account</button>
              </div><div style="margin-top:4px" class="muted small center">
                <div style="flex:1;height:1px;background:#f3f3f4;border-radius:2px"></div>
                <div style="padding:0 8px">or</div>
                <div style="flex:1;height:1px;background:#f3f3f4;border-radius:2px"></div>
              </div>
                 <section>
              <div class="social-buttons">
  <button class="btn fb">
    <i class="fab fa-facebook-f"></i>
    Continue with Facebook
  </button>

  <button class="btn google">
    <img src="https://cdn-icons-png.flaticon.com/128/300/300221.png" alt="">
    Continue with Google
  </button>

  <button class="btn apple">
    <i class="fab fa-apple"></i>
    Continue with Apple
  </button>
</div>
</section>
              <div class="muted small">By creating an account you agree to our terms.</div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: carousel -->
      <div class="right" id="carouselRoot" aria-hidden="false">
        <div class="arrow left" id="prev" role="button" aria-label="Previous slide">‹</div>
        <div class="arrow right" id="next" role="button" aria-label="Next slide">›</div>

        <div class="visual" id="visual" tabindex="0">
          <img id="heroImg" alt="Delicious meal" src="https://images.unsplash.com/photo-1525755662778-989d0524087e?auto=format&fit=crop&w=800&q=80">
          <h3 id="heroTitle">Order Your Favorites</h3>
          <p id="heroDesc" class="muted">Fresh food delivered on campus — fast.</p>
          <div class="dots" id="dots" aria-hidden="false"></div>
        </div>
      </div>
    </div>
  </div>

<script src="/Login_page/sign.js"></script>


</body>
</html>
